<script src="/platform.js"></script>
<script>
/* ============================================================
   إعدادات المنصة — عدّلها هنا
   ============================================================ */
const CONFIG = {
  platformName: 'منصة الحرفي السعودي',
  orgName: 'الحرفيين',                     // يظهر في عنوان المجتمع: "مجتمع الحرفيين"
  supportedBy: '',                        // اسم جهة داعمة تظهر في "من نحن" (اتركه فاضي إذا ما فيه)
  orgAbout: 'منصة تساعد الحرفيين والحرفيات والأسر المنتجة يسعّرون منتجاتهم صح، ويسوّقونها، ويتابعون طلباتهم ومبيعاتهم.',
  contactWhatsapp: '',                      // رقم واتساب إدارة المنصة (اختياري)
};

const REGIONS = ['جازان', 'عسير والباحة ونجران', 'الرياض ونجد', 'القصيم وحائل', 'مكة والمدينة والحجاز', 'المنطقة الشرقية والأحساء', 'تبوك والجوف والحدود الشمالية'];
const CATEGORIES = [['crafts', 'حرف يدوية'], ['food', 'أكل بيتي وحلويات'], ['scent', 'عطور وبخور وصابون'], ['sewing', 'خياطة وتطريز'], ['art', 'فن ورسم'], ['other', 'شي ثاني']];
const CRAFT_EXAMPLES = {
  'جازان': 'الخوص والسعف، الفخار، المشغولات الجازانية، الحناء',
  'عسير والباحة ونجران': 'القط العسيري، المشغولات الجلدية، الفضيات، الحجر والفخار',
  'الرياض ونجد': 'السدو، النقش على الخشب والأبواب النجدية، الخوص',
  'القصيم وحائل': 'السدو، الجلديات، الخوص',
  'مكة والمدينة والحجاز': 'الرواشين والخشب، التطريز الحجازي، الفضة، المسابح',
  'المنطقة الشرقية والأحساء': 'الخوص والسعف، البشوت والزري، الفخار الأحسائي',
  'تبوك والجوف والحدود الشمالية': 'السدو، الأحجار، الجلديات',
};

/* ---------- أدوات عامة ---------- */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nz = (v) => { const n = parseFloat(v); return isFinite(n) && n > 0 ? n : 0; };
const r2 = (n) => Math.round((Number(n) || 0) * 100) / 100;
const money = (n) => { const v = r2(n); return (Number.isInteger(v) ? String(v) : v.toFixed(2)) + ' ر.س'; };
const per100 = (n) => Math.round(n) + ' ريال';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
const parseDay = (s) => { const [y, m, d] = String(s || '').split('-').map(Number); return y ? new Date(y, m - 1, d) : null; };
const daysUntil = (s) => { const d = parseDay(s); if (!d) return null; const t = parseDay(todayStr()); return Math.round((d - t) / 86400000); };
const fmtDay = (s) => { const d = typeof s === 'string' && s.length === 10 ? parseDay(s) : new Date(s); return d && !isNaN(d) ? d.toLocaleDateString('ar-u-nu-latn', { day: 'numeric', month: 'long' }) : ''; };
const monthKey = (s) => String(s || '').slice(0, 7);
const monthName = (key) => { const [y, m] = key.split('-').map(Number); return new Date(y, m - 1, 1).toLocaleDateString('ar-u-nu-latn', { month: 'long', year: 'numeric' }); };
const plain = (t) => String(t || '').replace(/\*\*/g, '').replace(/^#+\s*/gm, '').replace(/^[-*•]\s+/gm, '');

let toastTimer;
function toast(text, ok = false) {
  const t = $('toast');
  t.textContent = text;
  t.classList.toggle('bg-red-600', !ok); t.classList.toggle('bg-green-700', ok);
  t.classList.remove('opacity-0'); t.classList.add('opacity-100');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.classList.remove('opacity-100'); t.classList.add('opacity-0'); }, 3200);
}

function copyText(text) {
  try {
    navigator.clipboard.writeText(text).then(() => toast('تم النسخ ✅', true)).catch(() => showCopyBox(text));
  } catch { showCopyBox(text); }
}
function showCopyBox(text) {
  openModal(`<h2 class="text-lg font-bold text-craft-800 mb-2">انسخ النص</h2><p class="hint mb-2">اضغط مطولاً على النص واختر نسخ.</p>
    <textarea class="inp" rows="8" id="copy-box" readonly>${esc(text)}</textarea>
    <button type="button" class="btn btn-main w-full mt-3" data-act="closeModal">تم</button>`);
  setTimeout(() => { const b = $('copy-box'); if (b) { b.focus(); b.select(); } }, 50);
}

function normPhone(p) {
  let d = String(p || '').replace(/[^\d]/g, '');
  if (!d) return '';
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('05')) d = '966' + d.slice(1);
  else if (d.length === 9 && d.startsWith('5')) d = '966' + d;
  return d;
}
const waLink = (text, phone) => `https://wa.me/${normPhone(phone)}?text=${encodeURIComponent(text)}`;

/* تنسيق آمن للنص: عريض، قوائم، عناوين */
function inlineMd(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>'); }
function md(src) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of String(src).split('\n')) {
    const line = raw.trim(); let m;
    if (!line) { close(); continue; }
    if ((m = line.match(/^#{1,4}\s+(.*)$/))) { close(); out.push(`<h4>${inlineMd(m[1])}</h4>`); }
    else if ((m = line.match(/^[-*•]\s+(.*)$/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inlineMd(m[1])}</li>`); }
    else if ((m = line.match(/^[0-9٠-٩]+[.)]\s+(.*)$/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inlineMd(m[1])}</li>`); }
    else { close(); out.push(`<p>${inlineMd(line)}</p>`); }
  }
  close(); return out.join('');
}

/* ---------- النوافذ ---------- */
function openModal(html) { $('modal-box').innerHTML = html; const m = $('modal'); m.classList.remove('hidden'); m.classList.add('flex'); }
function closeModal() { const m = $('modal'); m.classList.add('hidden'); m.classList.remove('flex'); }
$('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ============================================================
   البيانات: تُحفظ في الجهاز، وفي حساب الحرفي إذا متاح
   ============================================================ */
const STORE_KEY = 'artisan_state_v2';
const DEFAULT_STATE = () => ({
  v: 2, updatedAt: 0,
  profile: { name: '', craft: '', region: '', category: 'crafts', store: '', whatsapp: '', handle: '' },
  settings: { scale: 1, onboarded: false, lastProduct: '' },
  products: [], orders: [], sales: [], customers: [], texts: [], reviews: [],
  bazaar: null, impact: { baseline: null, followups: [] }, lessonsRead: [],
  usage: { visits: 0, tabs: {}, actions: {} }, feedback: [], catalogItems: [],
});
function newProduct(init = {}) {
  return Object.assign({
    id: uid(), name: '', craft: '', details: '', photo: '',
    materials: '', hours: '', wage: '', overhead: '', shipping: '', shipIn: true, margin: 40, fee: 0,
    unique: false, uniqueExtra: 50, matList: [], timer: { sessions: [], running: null, pieces: 0 },
    competitors: [], tiers: { shop: 20, bulk: 30, bulkMin: 20 }, createdAt: Date.now(),
  }, init);
}
function migrateV1() {
  const st = DEFAULT_STATE();
  try {
    const pl = JSON.parse(localStorage.getItem('artisan_pricelist_v1') || 'null');

async function aiRun({ prompt, outId, btn, kind, title = '', productId = '', images, json = false, onJson, wa = true, saveable = true }) {
  if (!aiReady()) return;
  const out = $(outId); if (!out) return;
  track('actions', kind);
  if (btn) btn.disabled = true;
  out.classList.remove('hidden');
  out.innerHTML = `<div class="card bg-craft-50">${loaderHtml()}</div>`;
  out.scrollIntoView({ behavior: 'smooth', block: 'center' });
  const body = document.createElement('div');
  try {
    const opts = { cache: false };
    if (images && CAP.canImages) opts.images = images;
    if (json) {
      const data = await CAP.sample.json(prompt, opts);
      out.innerHTML = '';
      onJson(data, out);
    } else {
      let started = false;
      opts.onText = ({ text }) => {
        if (!started) { started = true; out.innerHTML = ''; const c = document.createElement('div'); c.className = 'card'; body.className = 'md leading-relaxed text-gray-800'; c.appendChild(body); out.appendChild(c); }
        body.innerHTML = md(text);
      };
      const r = await CAP.sample(prompt, opts);
      if (!started) opts.onText({ text: r.text });
      body.innerHTML = md(r.text);
      body.parentElement.appendChild(outActions(r.text, { kind, title, productId, wa, saveable }));
      if (r.truncated) toast('الرد طويل وانقطع. اطلب شي أقصر.', true);
    }
  } catch (e) {
    if (e && e.text && e.code !== 'refused' && !json) { body.innerHTML = md(e.text); }
    else out.innerHTML = '';
    handleAIError(e);
  } finally {
    if (btn) btn.disabled = false;
  }
}

  const a = e.target.closest('[data-act]');

/* ============================================================
   التسعير
   margin = نسبة الربح فوق التكلفة. realMargin = ربحك من كل 100 ريال.
   ============================================================ */
function computeRow(p) {
  const materials = nz(p.materials), overhead = nz(p.overhead), hours = nz(p.hours), wage = nz(p.wage), shipping = nz(p.shipping);
  const markup = nz(p.margin), fee = Math.min(nz(p.fee), 80);
  const shipIn = p.shipIn !== false;
  const labor = hours * wage, production = materials + labor + overhead;
  const totalCost = production + (shipIn ? shipping : 0);
  let beforeFee = totalCost * (1 + markup / 100);
  const artValue = p.unique ? beforeFee * nz(p.uniqueExtra) / 100 : 0;
  beforeFee += artValue;
  const profitValue = beforeFee - totalCost;
  const sellingPrice = beforeFee / (1 - fee / 100);
  const feeValue = sellingPrice - beforeFee;
  const realMargin = sellingPrice > 0 ? profitValue / sellingPrice * 100 : 0;
  const rounded = sellingPrice > 0 ? Math.ceil(sellingPrice / 5) * 5 : 0;
  const t = p.tiers || {};
  const shopPrice = production * (1 + nz(t.shop) / 100);
  const bulkPrice = production * (1 + nz(t.bulk) / 100);
  return { materials, overhead, hours, wage, shipping, shipIn, labor, production, totalCost, profitValue, artValue, feeValue, sellingPrice, realMargin, rounded, markup, fee, shopPrice, bulkPrice, bulkMin: nz(t.bulkMin) || 20 };
}
function marginTone(m) {
  if (m < 15) return { text: 'text-red-700', box: 'bg-red-50 border-red-200', tag: 'bg-red-100 text-red-700', label: 'قليل، ارفع السعر', row: 'border-red-300' };
  if (m < 25) return { text: 'text-amber-700', box: 'bg-amber-50 border-amber-200', tag: 'bg-amber-100 text-amber-800', label: 'مقبول', row: 'border-amber-300' };
  return { text: 'text-green-700', box: 'bg-green-50 border-green-200', tag: 'bg-green-100 text-green-800', label: 'ممتاز', row: 'border-craft-200' };
}
function productContext(p) {
  if (!p) return '';
  const r = computeRow(p);
  return `منتج الحرفي "${p.name || 'بدون اسم'}"${p.details ? ` (${p.details})` : ''}:
- المواد: ${r.materials} ريال، الشغل: ${r.hours} ساعة × ${r.wage} ريال، الإيجار والكهرباء على القطعة: ${r.overhead} ريال
- الشحن: ${r.shipping} ريال (${r.shipIn ? 'داخل السعر' : 'على الزبون'})، نسبة المتجر أو الدفع: ${r.fee}%
- الربح فوق التكلفة: ${r.markup}%${p.unique ? `، قطعة فنية فريدة (+${nz(p.uniqueExtra)}% قيمة فنية)` : ''}
- كل التكاليف ${r2(r.totalCost)} ريال، سعر البيع ${r2(r.sellingPrice)} ريال، الربح ${r2(r.profitValue)} ريال، ربحه من كل 100 ريال: ${Math.round(r.realMargin)} ريال
- سعر المحلات ${r2(r.shopPrice)} ريال، سعر الطلبات الكبيرة (${r.bulkMin}+ قطعة) ${r2(r.bulkPrice)} ريال للقطعة`;
}

let timerTick = 0;
function renderTimer(p) {
  const box = $('timer-box'); if (!box) return;
  const tm = p.timer || (p.timer = { sessions: [], running: null, pieces: 0 });
  const totalMs = tm.sessions.reduce((a, s) => a + (s.e - s.s), 0) + (tm.running ? Date.now() - tm.running : 0);
  const hrs = totalMs / 3600000;
  const fmtT = (ms) => { const m = Math.floor(ms / 60000); return `${Math.floor(m / 60)} ساعة و ${m % 60} دقيقة`; };
  const avg = nz(tm.pieces) ? hrs / nz(tm.pieces) : 0;
  box.innerHTML = `
    <p class="hint mt-0">اضغط "بدأت" لما تبدأ الشغل، و"وقفت" لما تخلص أو ترتاح. المؤقت يكمل حتى لو قفلت الصفحة.</p>

    ${tm.running ? `<button type="button" class="btn w-full bg-red-600 hover:bg-red-700 text-white text-lg" data-act="timerStop"><i class="fa-solid fa-stop"></i> وقفت</button>` : `<button type="button" class="btn btn-main w-full text-lg" data-act="timerStart"><i class="fa-solid fa-play"></i> بدأت الشغل</button>`}
    ${fInput({ id: 'timer-pieces', label: 'كم قطعة خلّصت في هالوقت؟', value: tm.pieces || '', type: 'number', ph: '1' })}
    ${avg ? `<div class="flex items-center justify-between gap-2 bg-craft-50 rounded-xl p-3"><span>متوسط القطعة: <b class="num">${r2(avg)} ساعة</b></span><button type="button" class="btn btn-main btn-sm" data-act="timerUse">استخدمه في السعر</button></div>` : ''}
    ${tm.sessions.length ? `<button type="button" class="btn btn-soft btn-sm" data-act="timerReset">صفّر المؤقت</button>` : ''}`;
  $('timer-pieces').addEventListener('change', e => { tm.pieces = e.target.value; save(); renderTimer(p); });

}

/* تصغير صورة إلى صورة مصغّرة محفوظة */
function thumbFromFile(file, max = 480, quality = 0.8) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', quality)); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
function thumbFromCanvas(canvas, max = 480) {
  const k = Math.min(1, max / Math.max(canvas.width, canvas.height));
  const c = document.createElement('canvas'); c.width = Math.round(canvas.width * k); c.height = Math.round(canvas.height * k);
  c.getContext('2d').drawImage(canvas, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.8);
}

function buildSheet(rows) {
  const headers = ['اسم المنتج', 'المواد (ر.س)', 'ساعات العمل', 'أجر الساعة (ر.س)', 'الإيجار والكهرباء على القطعة (ر.س)', 'الشحن (ر.س)', 'الشحن داخل السعر؟', 'الربح فوق التكلفة (%)', 'نسبة المتجر أو الدفع (%)', 'قطعة فريدة؟', 'كل التكاليف (ر.س)', 'الربح (ر.س)', 'سعر البيع (ر.س)', 'ربحك من كل 100 ريال', 'سعر المحلات (ر.س)', 'سعر الكميات للقطعة (ر.س)'];
  const data = [headers];
  rows.forEach(p => { const c = computeRow(p); data.push([p.name || 'منتج', c.materials, c.hours, c.wage, c.overhead, c.shipping, c.shipIn ? 'نعم' : 'لا، على الزبون', c.markup, c.fee, p.unique ? `نعم (+${nz(p.uniqueExtra)}%)` : 'لا', r2(c.totalCost), r2(c.profitValue), r2(c.sellingPrice), Math.round(c.realMargin), r2(c.shopPrice), r2(c.bulkPrice)]); });
  const ws = XLSX.utils.aoa_to_sheet(data);
  ws['!cols'] = headers.map((h, i) => ({ wch: i === 0 ? 26 : Math.max(12, h.length) }));
  return ws;
}
function saveWorkbook(sheets, filename) {
  if (typeof XLSX === 'undefined') { toast('ما قدرنا نجهّز ملف Excel. افتح الصفحة من جديد.'); return; }
  const wb = XLSX.utils.book_new();
  sheets.forEach(([name, ws]) => XLSX.utils.book_append_sheet(wb, ws, name));
  wb.Workbook = { Views: [{ RTL: true }] };
  const bytes = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
  track('actions', 'excel');
  offerFile(filename, new Blob([bytes]), 'انحفظ الملف ✅');
}
ACT.exportExcel = () => { if (!S.products.length) { toast('أضف منتج أول.'); return; } saveWorkbook([['أسعار منتجاتي', buildSheet(S.products)]], 'أسعار_منتجاتي.xlsx'); };

ACT.sendFeedback = async (btn) => {
  const st = ROUTES.feedback._st;
  const entry = { at: new Date().toISOString(), rating: st.rating, tools: [...st.tools], hard: val('fb-hard').slice(0, 1500), idea: val('fb-idea').slice(0, 1500), name: val('fb-name').slice(0, 80) };
  if (!entry.rating && !entry.hard && !entry.idea && !entry.tools.length) { toast('اختر نجوم أو اكتب رأيك أول.'); return; }

let hijriFmt = null;
try { hijriFmt = new Intl.DateTimeFormat('en-u-ca-islamic-umalqura-nu-latn', { month: 'numeric', day: 'numeric' }); } catch { hijriFmt = null; }
let occCache = null;
function nextOccasions() {
  const key = todayStr(); if (occCache && occCache.key === key) return occCache.list;
  const t0 = parseDay(key), list = [];
  OCCASIONS.forEach(o => {
    let date = null;
    if (o.g) { date = new Date(t0.getFullYear(), o.g[0] - 1, o.g[1]); if (date < t0) date = new Date(t0.getFullYear() + 1, o.g[0] - 1, o.g[1]); }
    else if (hijriFmt) {
      for (let i = 0; i < 400; i++) {
        const d = new Date(t0.getFullYear(), t0.getMonth(), t0.getDate() + i);
        try { const parts = hijriFmt.formatToParts(d); const m = Number(parts.find(x => x.type === 'month').value), dd = Number(parts.find(x => x.type === 'day').value); if (m === o.h[0] && dd === o.h[1]) { date = d; break; } } catch { break; }
      }
    }
    if (date) list.push({ ...o, date, days: Math.round((date - t0) / 86400000) });
  });
  list.sort((a, b) => a.days - b.days);
  occCache = { key, list }; return list;
}

function enableStudio() { document.querySelectorAll('.studio-need').forEach(b => b.disabled = !st.img); document.querySelectorAll('.studio-ctrl').forEach(c => c.classList.toggle('opacity-60', !st.img)); }

    if (x1 > x0 && y1 > y0) { const px = ctx.getImageData(x0, y0, x1 - x0, y1 - y0); adjustPixels(px); ctx.putImageData(px, x0, y0); }

function drawSadu(ctx, W, H, t) {

function bubbleHtml(m, i) {

  const items = [welcome, ...CHAT.view];
  log.innerHTML = items.map(bubbleHtml).join('');
  items.forEach((m, i) => { if (m.role === 'assistant' && i > 0 && !m.pending && m.text) { const slot = log.querySelector(`.chat-actions[data-i="${i}"]`); if (slot) slot.appendChild(outActions(m.text, { kind: 'chat' })); } });
  window.scrollTo(0, document.body.scrollHeight);
}
function setChatBusy(on) {
  CHAT.busy = on; const l = $('chat-send-l'); if (!l) return;
  l.textContent = on ? 'وقّف' : 'أرسل';
  $('chat-send').classList.toggle('bg-red-600', on);
}
ACT.chatStarter = (b) => sendChat(b.textContent);
ACT.chatSend = () => { if (CHAT.busy) { CHAT.ctl && CHAT.ctl.abort(); return; } sendChat($('chat-input').value); };
ACT.chatReset = () => { if (CHAT.busy) return; CHAT.turns = []; CHAT.view = []; renderChatLog(); };
ACT.chatClearAtt = () => { CHAT.file = null; CHAT.fileUrl = null; $('chat-file').value = ''; $('chat-att').classList.add('hidden'); $('chat-att').classList.remove('flex'); };
function allProductsContext() {
  if (!S.products.length) return 'الحرفي ما أضاف منتجات للحين.';
  return 'منتجات الحرفي:\n' + S.products.slice(0, 15).map(p => { const c = computeRow(p); return `- ${p.name || 'منتج'}: التكلفة ${r2(c.totalCost)} ريال، السعر ${r2(c.sellingPrice)} ريال، الربح فوق التكلفة ${c.markup}%، ربحه من كل 100 ريال ${Math.round(c.realMargin)} ريال`; }).join('\n');
}
async function sendChat(text) {
  text = (text || '').trim();
  const file = CHAT.file, fileUrl = CHAT.fileUrl;
  if ((!text && !file) || CHAT.busy) return;
  if (!aiReady()) return;
  if (!text) text = 'قيّم صورة منتجي واقترح كيف أصوّره أحسن.';
  ACT.chatClearAtt();
  track('actions', 'chat');
  CHAT.turns.push({ role: 'user', content: file ? text + '\n\n(أرفقتُ صورة للمنتج مع هذه الرسالة.)' : text });
  CHAT.view.push({ role: 'user', text, img: fileUrl });
  const reply = { role: 'assistant', text: '', pending: true }; CHAT.view.push(reply);
  $('chat-input').value = ''; $('chat-input').style.height = 'auto';
  renderChatLog(); setChatBusy(true);
  CHAT.ctl = new AbortController();
  const openOrders = S.orders.filter(o => o.status !== 'done').length;
  const ctx = rules() + '\n\nفي المحادثة: الرد قصير (أقل من 150 كلمة) إلا إذا طُلب التفصيل، واختم بسؤال واحد أو خطوة تالية واحدة.\n\n' + allProductsContext() + (openOrders ? `\nعنده ${openOrders} طلبات مفتوحة.` : '') + '\n\nالرسائل التالية هي المحادثة مع الحرفي. أجب على آخر رسالة.';
  const idx = CHAT.view.length; // ترتيب الفقاعة مع رسالة الترحيب
  const opts = { cache: false, signal: CHAT.ctl.signal, onText: ({ text }) => { reply.pending = false; reply.text = text; const el = $('bub-' + idx); if (el) el.innerHTML = md(text); } };
  if (file && CAP.canImages) opts.images = file;
  try {
    const r = await CAP.sample([{ role: 'user', content: ctx }, ...CHAT.turns.slice(-20)], opts);
    reply.pending = false; reply.text = r.text; CHAT.turns.push({ role: 'assistant', content: r.text });
    if (r.truncated) toast('الرد طويل وانقطع. قل له: كمّل.', true);
  } catch (e) {
    reply.pending = false;
    if (e && e.text && e.code !== 'refused') { reply.text = e.text; CHAT.turns.push({ role: 'assistant', content: e.text }); }
    else { CHAT.view.pop(); }
    if (!(e && e.code === 'cancelled')) handleAIError(e);
  } finally {
    setChatBusy(false); CHAT.ctl = null;
    if (CUR.name === 'chat') renderChatLog();
  }
}

}

const IMG_CACHE = {};
function getImg(src, onload) {
  if (!src) return null;
  if (IMG_CACHE[src]) return IMG_CACHE[src].complete ? IMG_CACHE[src] : null;
  const im = new Image(); im.onload = onload; im.src = src; IMG_CACHE[src] = im; return null;
}
function wrapLines(ctx, text, maxW) {
  const out = [];
  String(text || '').split('\n').forEach(par => {
    const words = par.split(/\s+/).filter(Boolean); let line = '';
    words.forEach(w => { const t = line ? line + ' ' + w : w; if (ctx.measureText(t).width > maxW && line) { out.push(line); line = w; } else line = t; });
    out.push(line);
  });
  return out;
}
function txt(ctx, text, x, y, { size = 40, weight = 500, color = '#32221a', align = 'center', maxW = 900, lh = 1.5, font = 'Tajawal' } = {}) {
  ctx.font = `${weight} ${size}px ${font}, Tajawal, Tahoma, sans-serif`; ctx.fillStyle = color; ctx.textAlign = align; ctx.textBaseline = 'top';
  ctx.direction = dirOf(String(text)) ;
  const lines = wrapLines(ctx, text, maxW);
  lines.forEach((l, i) => ctx.fillText(l, x, y + i * size * lh));
  return y + lines.length * size * lh;
}
function saduBand(ctx, x, y, w, h) {
  ctx.fillStyle = '#7a2520'; ctx.fillRect(x, y, w, h);
  const s = h * 0.8, mg = h * 0.1;
  for (let i = 0, xx = x; xx < x + w; xx += s, i++) { ctx.fillStyle = i % 2 ? '#1f1a17' : '#f3e6d0'; ctx.beginPath(); ctx.moveTo(xx, y + mg + s); ctx.lineTo(xx + s / 2, y + mg); ctx.lineTo(xx + s, y + mg + s); ctx.closePath(); ctx.fill(); }
}
function cardBase(ctx, W, H, bg = '#fdf8f6') {
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  saduBand(ctx, 0, 0, W, 36); saduBand(ctx, 0, H - 36, W, 36);
  ctx.strokeStyle = '#d9a441'; ctx.lineWidth = 4; ctx.strokeRect(40, 70, W - 80, H - 140);
}
function cardProduct(params) { const o = S.orders.find(x => x.id === params.orderId); return prodById(params.productId) || (o && prodById(o.productId)) || prodById(S.settings.lastProduct) || S.products[0] || null; }

function drawLogo() {
  const cv = $('logo-canvas'); if (!cv) return; const d = ROUTES.logo._d;
  const [, , main, bg, acc] = LOGO_THEMES.find(t => t[0] === d.theme) || LOGO_THEMES[0];
  const W = 1080, H = 1080; cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  if (d.shape === 'circle') { ctx.strokeStyle = main; ctx.lineWidth = 18; ctx.beginPath(); ctx.arc(W / 2, H / 2, 420, 0, Math.PI * 2); ctx.stroke(); ctx.strokeStyle = acc; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(W / 2, H / 2, 380, 0, Math.PI * 2); ctx.stroke(); }
  if (d.shape === 'band') { saduBand(ctx, 140, 700, W - 280, 50); ctx.fillStyle = main; ctx.fillRect(140, 300, W - 280, 10); }
  const name = d.name || 'اسم متجرك';
  let size = 150; ctx.font = `700 ${size}px "Reem Kufi", Tajawal, sans-serif`;
  while (ctx.measureText(name).width > 700 && size > 60) { size -= 6; ctx.font = `700 ${size}px "Reem Kufi", Tajawal, sans-serif`; }
  ctx.fillStyle = main; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.direction = dirOf(name);
  ctx.fillText(name, W / 2, H / 2 - (d.sub ? 40 : 0));
  if (d.sub) { ctx.font = `500 52px Tajawal, sans-serif`; ctx.fillStyle = acc === '#3d2a1e' ? acc : main; ctx.globalAlpha = 0.85; ctx.direction = dirOf(d.sub); ctx.fillText(d.sub, W / 2, H / 2 + size * 0.55); ctx.globalAlpha = 1; }
}

function smallThumb(dataUrl, max = 240) {
  return new Promise(res => { if (!dataUrl) return res(''); const im = new Image(); im.onload = () => { const k = Math.min(1, max / Math.max(im.naturalWidth, im.naturalHeight)); const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.72)); }; im.onerror = () => res(''); im.src = dataUrl; });
}

  btn.disabled = true; btn.textContent = 'لحظة…';
  try {
    const items = [];
    for (const id of ids) { const p = prodById(id); items.push({ id, name: p.name || 'منتج', price: computeRow(p).rounded, photo: await smallThumb(p.photo) }); }
    await CAP.db.doc('catalog/' + CAP.uid).set({ name: val('cm-name') || myName(), craft: S.profile.craft || '', region: S.profile.region || '', whatsapp: val('cm-wa'), items, updatedAt: new Date().toISOString() });
    S.catalogItems = ids; save(); track('actions', 'catalog'); toast('انعرضت منتجاتك في المعرض ✅', true); go('catalog');
  } catch { toast('ما قدرنا ننشر. تأكد إن عندك صلاحية "مساهم" في الرابط.'); btn.disabled = false; btn.textContent = 'انشر في المعرض'; }
};
